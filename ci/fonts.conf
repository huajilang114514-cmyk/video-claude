<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The renderer asks for macOS font families by name (ai_history_film.py:58-59). Map them to
     metrically close free fonts so the CI render keeps the same look and the same line breaks. -->
<fontconfig>
  <alias binding="same"><family>Songti SC</family>
    <prefer><family>Noto Serif CJK SC</family><family>Noto Serif CJK JP</family><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same"><family>Times New Roman</family>
    <prefer><family>Liberation Serif</family><family>DejaVu Serif</family></prefer>
  </alias>
  <alias binding="same"><family>STIX Two Math</family>
    <prefer><family>Noto Sans Math</family><family>STIX</family><family>DejaVu Sans</family></prefer>
  </alias>
</fontconfig>
